name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and build
        # `verify` runs unit/integration tests, then packages the Spring Boot jar.
        # Failures in the test phase fail the job (no -DskipTests).
        # Tests use the `test` profile with H2 in PostgreSQL mode (see application-test.yml).
        run: mvn -B verify

  frontend:
    name: Frontend (Node / Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Unit tests
        run: npm run test:ci
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      - name: Production build
        run: npm run build -- --configuration=production
