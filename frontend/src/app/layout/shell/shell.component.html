@if (isHandset$ | async; as isHandset) {
  <mat-sidenav-container class="shell">
    <mat-sidenav
      class="shell-nav"
      [mode]="isHandset ? 'over' : 'side'"
      [opened]="!isHandset"
      [fixedInViewport]="isHandset"
      #drawer
    >
      <div class="brand">
        <span class="brand-mark">P</span>
        <div>
          <strong>PayLens</strong>
          <small>Salary management</small>
        </div>
      </div>

      <mat-nav-list>
        @for (item of navItems; track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive="active"
            (click)="isHandset && drawer.close()"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar class="shell-header" color="primary">
        @if (isHandset) {
          <button
            mat-icon-button
            type="button"
            aria-label="Open navigation"
            (click)="drawer.toggle()"
          >
            <mat-icon>menu</mat-icon>
          </button>
        }
        <span class="header-title">PayLens</span>
        <span class="header-spacer"></span>
        <span class="header-role">HR Manager</span>
      </mat-toolbar>

      @if (loadingService.loading()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      }

      <main class="shell-content">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
}
