spring:
  datasource:
    url: jdbc:h2:mem:paylens;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

paylens:
  security:
    hr-username: hr.manager
    # Test-only bootstrap secret (encoded with BCrypt at startup; never used in prod profiles).
    hr-password: test-hr-password
