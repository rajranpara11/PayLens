spring:
  application:
    name: paylens-api
  profiles:
    default: dev
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        name: PAYLENSSESSION
        http-only: true
        same-site: lax
      timeout: 8h

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

paylens:
  cors:
    allowed-origins: ${PAYLENS_CORS_ORIGINS:http://localhost:4200}
  security:
    hr-username: ${PAYLENS_HR_USERNAME:}
    # Must be a real BCrypt hash (starts with $2a$ / $2b$ / $2y$). Leave empty for local password bootstrap.
    hr-password-hash: ${PAYLENS_HR_PASSWORD_HASH:}
    hr-password: ${PAYLENS_HR_PASSWORD:}
    # When false, OpenAPI/Swagger paths are not publicly permitted (prod default).
    expose-api-docs: ${PAYLENS_EXPOSE_API_DOCS:true}
  seed:
    enabled: false
    employee-count: 10000
    random-seed: 42
    batch-size: 500
