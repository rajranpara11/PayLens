# Local/dev overrides. Credentials still come from the environment — never commit secrets.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/paylens}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true

logging:
  level:
    com.paylens: INFO
    org.flywaydb: INFO

# Local-only defaults so IDE/debugger starts work without env.
# Override anytime with PAYLENS_HR_* env vars. Never put plaintext in hr-password-hash.
paylens:
  security:
    hr-username: ${PAYLENS_HR_USERNAME:admin}
    hr-password: ${PAYLENS_HR_PASSWORD:admin}
