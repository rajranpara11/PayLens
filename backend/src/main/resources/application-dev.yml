# Local/dev overrides. Credentials must come from the environment — never commit secrets.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/paylens}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true

logging:
  level:
    com.paylens: INFO
    org.flywaydb: INFO

# Local bootstrap — set in the same shell / IDE run config before starting the API:
#   PAYLENS_HR_USERNAME / PAYLENS_HR_PASSWORD (or PAYLENS_HR_PASSWORD_HASH)
# No credential defaults here (avoids accidental admin/admin on misconfigured hosts).
paylens:
  security:
    expose-api-docs: true
